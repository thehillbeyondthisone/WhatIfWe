<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What if we…</title>
<style>
  :root{
    --bg: #0f172a;           /* slate-900 */
    --panel: #0b1226;        /* deeper panel */
    --muted: #1e293b;        /* slate-800 */
    --muted-2:#334155;       /* slate-700 */
    --text: #e5e7eb;         /* zinc-200 */
    --subtle:#cbd5e1;        /* slate-300 */
    --brand:#7dd3fc;         /* sky-300 */
    --brand-2:#38bdf8;       /* sky-400 */
    --accent:#f59e0b;        /* amber-500 */
    --danger:#ef4444;        /* red-500 */
    --ok:#22c55e;            /* green-500 */
    --border: #243244;       /* cool border */
    --chip-bg:#0f2238;
    --chip-txt:#b0d6f7;
    --shadow: 0 2px 14px rgba(0,0,0,.35);
    --radius: 12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; padding:0; overflow-x:hidden}
  body{
    background:linear-gradient(180deg,#0b1020 0%, var(--bg) 60%);
    color:var(--text);
    font:16px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
    /* Safe area insets for iOS */
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* Login screen */
  .login-screen{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:20px; text-align:center;
    background:var(--bg);
  }
  .login-screen h1{font-size:32px; margin:0 0 10px; letter-spacing:.3px}
  .login-screen p{color:var(--subtle); margin:0 0 40px; font-size:16px}
  .login-buttons{display:flex; flex-direction:column; gap:16px; width:100%; max-width:300px}
  .login-btn{
    padding:18px 24px; border:2px solid var(--brand); border-radius:12px;
    background:linear-gradient(180deg, rgba(125,211,252,.1), rgba(125,211,252,.05));
    color:var(--brand); font-size:18px; font-weight:700; cursor:pointer;
    transition:all 0.2s;
  }
  .login-btn:active{transform:scale(0.98); background:var(--brand); color:#0b1020}

  /* Settings Menu */
  .settings-toggle{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    padding:10px;
    border-radius:8px;
    font-size:20px;
    cursor:pointer;
  }

  .settings-panel{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:8px;
    padding:12px;
    background:var(--muted);
    border:1px solid var(--border);
    border-radius:8px;
  }

  .settings-panel.hidden{
    display:none;
  }

  .app{
    max-width:100%; margin:0; padding:0 0 80px;
  }

  /* Header - fixed at top */
  header{
    display:flex; gap:12px; flex-direction:column; padding:16px;
    background:var(--panel); border-bottom:1px solid var(--border);
    position:fixed; top:0; left:0; right:0; z-index:100;
  }
  .title{display:flex; align-items:center; justify-content:space-between; width:100%}
  .title h1{margin:0; font-size:20px; letter-spacing:.3px; font-weight:700}
  .subtitle{color:var(--subtle); font-size:12px; margin-left:auto}
  .controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

  .btn, .select, .field{
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    border-radius:8px; padding:10px 14px; outline:none; font-size:14px;
  }
  .field{flex:1; min-width:0}
  .select{appearance:none; padding-right:30px}
  .btn{cursor:pointer; font-weight:600; white-space:nowrap}
  .btn.primary{background:linear-gradient(180deg,var(--brand),var(--brand-2)); color:#03121d; border:0}
  .btn.ghost{background:transparent}
  .btn.danger{background:var(--danger); border-color:transparent; color:white}
  .btn:disabled{opacity:.6; cursor:not-allowed}

  /* Toolbar */
  .seg{
    display:flex; background:var(--panel); border:1px solid var(--border);
    border-radius:8px; overflow:hidden;
  }
  .seg button{
    border:0; background:transparent; color:var(--subtle);
    padding:8px 14px; cursor:pointer; font-weight:600; font-size:14px;
  }
  .seg button.active{background:var(--brand); color:#0b1020}

  /* Swipe Container */
  .swipe-container{
    position:relative;
    width:100%;
    height:calc(100vh - 140px);
    margin-top:140px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:hidden;
  }

  .swipe-stack{
    position:relative;
    width:100%;
    max-width:400px;
    height:100%;
  }

  .swipe-card{
    position:absolute;
    width:100%;
    height:100%;
    border:2px solid var(--border);
    background:linear-gradient(180deg, #0c162a, #0b1424);
    border-radius:16px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform 0.3s ease, opacity 0.3s ease;
    cursor:grab;
    touch-action:none;
  }

  .swipe-card:active{cursor:grabbing}

  .swipe-card.swiping{transition:none}

  .swipe-card.swiped-left{
    transform:translateX(-150vw) rotate(-30deg);
    opacity:0;
    transition:all 0.3s ease-out;
  }

  .swipe-card.swiped-right{
    transform:translateX(150vw) rotate(30deg);
    opacity:0;
    transition:all 0.3s ease-out;
  }

  /* Stack effect - cards behind */
  .swipe-card:nth-child(2){
    transform:scale(0.95) translateY(10px);
    opacity:0.8;
    z-index:1;
  }

  .swipe-card:nth-child(3){
    transform:scale(0.9) translateY(20px);
    opacity:0.6;
    z-index:0;
  }

  .swipe-card:nth-child(n+4){
    display:none;
  }

  /* Swipe indicators */
  .swipe-indicator{
    position:absolute;
    top:40px;
    font-size:72px;
    font-weight:900;
    padding:20px 30px;
    border:4px solid;
    border-radius:12px;
    opacity:0;
    transition:opacity 0.2s;
    z-index:10;
    pointer-events:none;
  }

  .swipe-indicator.like{
    right:40px;
    color:#22c55e;
    border-color:#22c55e;
    transform:rotate(20deg);
  }

  .swipe-indicator.nope{
    left:40px;
    color:#ef4444;
    border-color:#ef4444;
    transform:rotate(-20deg);
  }

  .swipe-card.dragging-right .swipe-indicator.like{
    opacity:1;
  }

  .swipe-card.dragging-left .swipe-indicator.nope{
    opacity:1;
  }

  /* Grid (for list view) */
  .grid{
    padding:16px; display:flex; flex-direction:column; gap:16px;
    margin-top:140px; /* Space for fixed header */
  }
  .card{
    border:1px solid var(--border);
    background:linear-gradient(180deg, #0c162a, #0b1424);
    border-radius:12px; overflow:hidden; box-shadow:var(--shadow);
  }
  .media{
    position:relative; background:#081223; border-bottom:1px solid var(--border);
    min-height:200px; display:flex; align-items:center; justify-content:center;
  }
  .media img{width:100%; height:100%; object-fit:cover; display:block}

  /* Swipe card specific - 50/50 split */
  .swipe-card .media{
    height:50%;
    min-height:250px;
    position:relative;
    background:#081223;
  }

  .swipe-card .media img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .swipe-card .card-body{
    height:50%;
    display:flex;
    flex-direction:column;
    padding:16px;
    overflow-y:auto;
  }

  .swipe-card .desc{
    font-size:18px;
    font-weight:700;
    line-height:1.4;
    margin:0 0 12px;
    color:#dbeafe;
  }

  .swipe-card .rating-badge{
    display:inline-block;
    background:var(--accent);
    color:#0f172a;
    padding:4px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:700;
    margin-bottom:12px;
  }

  /* Chat bubbles */
  .comments-section{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:8px;
    max-height:150px;
  }

  .comment{
    max-width:85%;
    padding:8px 10px;
    border-radius:10px;
    font-size:13px;
    line-height:1.3;
    word-wrap:break-word;
  }

  .comment.person1{
    align-self:flex-start;
    background:linear-gradient(135deg, #1e3a5f, #2a4a70);
    border:1px solid #3a5a80;
  }

  .comment.person2{
    align-self:flex-end;
    background:linear-gradient(135deg, #2d1f4a, #3a2a5a);
    border:1px solid #4a3a6a;
  }

  .comment-author{
    font-size:10px;
    color:var(--subtle);
    margin-bottom:2px;
    font-weight:600;
  }

  .comment-text{
    color:var(--text);
  }

  .comment-input-wrapper{
    margin-top:8px;
    display:flex;
    gap:6px;
    flex-shrink:0;
  }

  .comment-input{
    flex:1;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    border-radius:6px;
    padding:6px 10px;
    font-size:13px;
    outline:none;
  }

  .comment-send{
    background:var(--brand);
    color:#0b1020;
    border:none;
    border-radius:6px;
    padding:6px 12px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }

  /* Action buttons for swipe mode */
  .swipe-actions{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:16px;
    z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
  }

  .swipe-btn{
    width:64px;
    height:64px;
    border-radius:50%;
    border:3px solid;
    background:rgba(11,18,38,0.95);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    cursor:pointer;
    transition:all 0.15s;
    backdrop-filter:blur(10px);
  }

  .swipe-btn:active{
    transform:scale(0.92);
  }

  .swipe-btn.nope{
    border-color:#ef4444;
    color:#ef4444;
  }

  .swipe-btn.skip{
    border-color:var(--brand);
    color:var(--brand);
    width:56px;
    height:56px;
    font-size:24px;
  }

  .swipe-btn.like{
    border-color:#22c55e;
    color:#22c55e;
  }

  .media .badge{
    position:absolute; top:20px; left:20px; font-size:12px; font-weight:700;
    background:rgba(2,6,23,.95); border:1px solid var(--border);
    color:var(--brand); padding:6px 10px; border-radius:8px;
    z-index:3;
    backdrop-filter:blur(10px);
  }
  .media .new-badge{
    position:absolute; top:20px; right:20px; font-size:13px; font-weight:700;
    background:rgba(245,158,11,0.95); border:1px solid #d97706;
    color:#0f172a; padding:6px 12px; border-radius:8px;
    animation: pulse 2s ease-in-out infinite;
    z-index:3;
    backdrop-filter:blur(10px);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .media .edit{
    position:absolute; bottom:8px; right:8px;
    background:rgba(2,6,23,.9); border:1px solid var(--border);
    color:var(--text); padding:8px 12px; border-radius:6px; cursor:pointer;
    font-size:12px; font-weight:600;
  }
  .card-body{padding:14px}
  .desc{
    font-size:15px; font-weight:600; margin:0 0 12px; color:#dbeafe; line-height:1.4;
  }
  .ratings{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    border-top:1px dashed var(--border); padding:12px 14px; margin-top:auto;
  }
  .stars, .stars-inline{display:flex; gap:4px; cursor:pointer}
  .stars .s, .stars-inline .s{font-size:20px; color:#334155; cursor:pointer}
  .stars .s.f, .stars-inline .s.f{color:#fbbf24}
  .rating-section{
    margin:12px 0;
    padding:12px;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--border);
    border-radius:8px;
  }
  .peer{font-size:13px; color:var(--subtle); font-weight:600}

  /* Row actions */
  .row-actions{
    display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--border);
    flex-wrap:wrap;
  }
  .row-actions .btn{border-radius:6px; flex:1; min-width:0; padding:10px}

  .empty{
    padding:40px 20px; text-align:center; color:var(--subtle);
  }

  /* Modal/Dialog */
  dialog{
    border:none; border-radius:0; padding:0; width:100%; max-width:100%; height:100vh; max-height:100vh;
    background:var(--bg); color:var(--text); margin:0; position:fixed; inset:0;
  }
  dialog::backdrop{background:rgba(0,0,0,.8)}
  .sheet{display:flex; flex-direction:column; height:100%; overflow:hidden}
  .sheet .content{padding:20px 20px 0; overflow-y:auto; flex:1}
  .f{display:flex; flex-direction:column; gap:16px}
  .f label{font-size:13px; color:var(--subtle); font-weight:600; margin-bottom:6px; display:block}
  .f input[type="text"], .f input[type="url"], .f input[type="file"], .f textarea{
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    border-radius:8px; padding:12px; outline:none; font-size:16px; width:100%;
  }
  .f textarea{min-height:100px; resize:vertical; font-family:inherit}
  .f input[type="checkbox"]{width:20px; height:20px; cursor:pointer}
  .f input[type="file"]{padding:10px}
  .sheet .footer{
    display:flex; gap:10px; padding:16px;
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border); background:var(--panel);
  }

  .view-mode-toggle{
    display:flex;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
  }

  .view-mode-toggle button{
    border:0;
    background:transparent;
    color:var(--subtle);
    padding:8px 14px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
  }

  .view-mode-toggle button.active{
    background:var(--brand);
    color:#0b1020;
  }

  /* Notifications */
  .notification{
    position:fixed; top:160px; left:16px; right:16px; z-index:1000;
    background:linear-gradient(180deg, #1a2c4a, #0f1d35);
    border:1px solid var(--brand); border-radius:12px;
    padding:16px; box-shadow:0 8px 32px rgba(0,0,0,.8);
    animation:slideDown 0.3s ease-out;
  }
  @keyframes slideDown {
    from { transform:translateY(-100px); opacity:0; }
    to { transform:translateY(0); opacity:1; }
  }
  .notification.exit{animation:slideUp 0.3s ease-in forwards}
  @keyframes slideUp {
    from { transform:translateY(0); opacity:1; }
    to { transform:translateY(-100px); opacity:0; }
  }
  .notification-title{font-weight:700; color:var(--brand); margin-bottom:6px; font-size:15px}
  .notification-body{font-size:14px; color:var(--text)}

  /* Utility */
  .hidden{display:none !important}
  .grow{flex:1}
</style>
</head>
<body>
<!-- Login Screen -->
<div id="loginScreen" class="login-screen hidden">
  <h1>What if we…</h1>
  <p>Choose your profile to continue</p>
  <div class="login-buttons">
    <button class="login-btn" onclick="auth.login('person1')">Partner 1</button>
    <button class="login-btn" onclick="auth.login('person2')">Partner 2</button>
  </div>
</div>

<!-- Main App -->
<div id="mainApp" class="app hidden">
  <header>
    <div class="title">
      <h1>What if we…</h1>
      <div style="display:flex; gap:8px; align-items:center">
        <button class="settings-toggle" onclick="ui.toggleSettings()">⚙</button>
        <button class="btn ghost" onclick="auth.logout()">Switch User</button>
      </div>
    </div>
    <div class="settings-panel hidden" id="settingsPanel">
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div>
          <label style="font-size:12px; color:var(--subtle); margin-bottom:4px; display:block;">Mode</label>
          <div class="view-mode-toggle">
            <button class="active" id="modeSwipe" onclick="ui.setMode('swipe')">💫 Swipe</button>
            <button id="modeList" onclick="ui.setMode('list')">📋 List</button>
          </div>
        </div>
        <div>
          <label style="font-size:12px; color:var(--subtle); margin-bottom:4px; display:block;">View</label>
          <div class="seg">
            <button class="active" id="viewAll" onclick="ui.setView('all')">All Ideas</button>
            <button id="viewDeclined" onclick="ui.setView('declined')">Declined</button>
            <button id="viewWould" onclick="ui.setView('would')">Would ✅</button>
          </div>
        </div>
        <input class="field" id="q" placeholder="Search…" oninput="ui.renderCurrent()">
        <select class="select" id="sort" onchange="ui.renderCurrent()">
          <option value="date_desc">Newest</option>
          <option value="date_asc">Oldest</option>
          <option value="my_rating_desc">My rating ↓</option>
          <option value="my_rating_asc">My rating ↑</option>
          <option value="avg_desc">Avg rating ↓</option>
          <option value="avg_asc">Avg rating ↑</option>
        </select>
        <button class="btn primary" onclick="ui.openForm()" style="width:100%">+ Add New Idea</button>
      </div>
    </div>
  </header>

  <!-- Swipe Mode -->
  <div class="swipe-container" id="swipeContainer">
    <div class="swipe-stack" id="swipeStack"></div>
    <div class="swipe-actions">
      <div class="swipe-btn nope" onclick="swiper.swipeLeft()">✕</div>
      <div class="swipe-btn skip" onclick="swiper.skip()">👁</div>
      <div class="swipe-btn like" onclick="swiper.swipeRight()">❤</div>
    </div>
  </div>

  <!-- List Mode -->
  <div class="grid hidden" id="grid"></div>
  <div class="empty hidden" id="emptyState">
    No ideas yet. Tap "+ Add" to create one!
  </div>
</div>

<!-- Notifications -->
<div id="notifications"></div>

<!-- Edit Dialog -->
<dialog id="sheet">
  <div class="sheet">
    <div class="content">
      <form class="f" id="form" onsubmit="formHandlers.save(event)">
        <input type="hidden" id="id">
        <div>
          <label for="desc">What's the idea?</label>
          <textarea id="desc" required placeholder="e.g. Take a pottery class, sunset hike, board-game café…"></textarea>
        </div>
        <div>
          <label for="imageFile">Upload Image 📸</label>
          <input type="file" id="imageFile" accept="image/*" onchange="uploadHandlers.handleImageUpload(event)">
          <div id="imagePreview" class="hidden" style="margin-top:10px">
            <img id="imagePreviewImg" style="max-width:100%; border-radius:8px; border:1px solid var(--border)">
          </div>
        </div>
        <div>
          <label for="video">Video URL (optional)</label>
          <input type="url" id="video" placeholder="https://youtu.be/…">
        </div>
        <div>
          <label>Your rating</label>
          <div class="stars" id="myStars"></div>
        </div>
        <div>
          <label for="notes">Notes (visible to both)</label>
          <textarea id="notes" placeholder="Planning details, location, cost, etc."></textarea>
        </div>
        <div>
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer">
            <input type="checkbox" id="completed">
            <span>✅ We did this!</span>
          </label>
        </div>
      </form>
    </div>
    <div class="footer">
      <button class="btn danger hidden" id="delBtn" onclick="formHandlers.del()">Delete</button>
      <button class="btn ghost" onclick="ui.closeForm()">Cancel</button>
      <div class="grow"></div>
      <button class="btn primary" form="form">Save</button>
    </div>
  </div>
</dialog>

<script>
/* ---------- Data & API ---------- */
const api = {
  async getIdeas(){
    const res = await fetch('/api/ideas');
    return res.json();
  },
  async addIdea(idea){
    const res = await fetch('/api/ideas', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(idea)
    });
    return res.json();
  },
  async updateIdea(id, updates){
    const res = await fetch(`/api/ideas/${id}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(updates)
    });
    return res.json();
  },
  async rateIdea(id, person, rating){
    const res = await fetch(`/api/ideas/${id}/rate`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ person, rating })
    });
    return res.json();
  },
  async deleteIdea(id){
    const res = await fetch(`/api/ideas/${id}`, { method: 'DELETE' });
    return res.json();
  },
  async bulkUpdate(ideas){
    const res = await fetch('/api/ideas/bulk', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ ideas })
    });
    return res.json();
  }
};

const state = {
  user: null,
  ideas: [],
  query:'',
  sort:'date_desc',
  view: 'all',
  mode: 'swipe', // 'swipe' or 'list'
  currentImageData: null, // Base64 image data from upload
  lastSeenIdeas: JSON.parse(localStorage.getItem('lastSeenIdeas') || '[]')
};

/* ---------- Authentication ---------- */
const auth = {
  login(user) {
    state.user = user;
    localStorage.setItem('loggedInUser', user);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');

    loadIdeas().then(() => {
      if (state.mode === 'swipe') {
        ui.renderSwipe();
      } else {
        ui.render();
      }
    });
  },
  logout() {
    state.user = null;
    localStorage.removeItem('loggedInUser');
    document.getElementById('mainApp').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
  },
  checkLogin() {
    // Always show login screen on refresh
    localStorage.removeItem('loggedInUser');
    document.getElementById('loginScreen').classList.remove('hidden');
  }
};

const users = {person1:'Partner 1', person2:'Partner 2'};

function avgRating(r){ return ((r.person1||0)+(r.person2||0))/2; }

/* ---------- Image Upload ---------- */

  handleImageUpload(event) {

    if (!file) return;

/* ---------- Notifications ---------- */
const notifications = {
  show(title, body, duration = 5000) {

    const notif = document.createElement('div');

    notif.innerHTML = `
      <div class="notification-title">${esc(title)}</div>

  checkNewIdeas(ideas) {
    const otherUser = state.user === 'person1' ? 'person2' : 'person1';

      idea.createdBy === otherUser &&
      !state.lastSeenIdeas.includes(idea.id)
    );

    if (newIdeas.length > 0) {
      newIdeas.forEach(idea => {
        this.show('🎉 New Idea!', `${users[otherUser]} added: "${idea.description.slice(0, 50)}..."`, 6000);

  checkMutual5Stars(idea) {

      this.show('⭐ Mutual 5 Stars!', `Both of you LOVE: "${idea.description}"`, 7000);

function ytId(url){
  try{
    const u = new URL(url);
    if (u.hostname.includes('youtu.be')) return u.pathname.slice(1);
    if ((u.hostname.includes('youtube.com')||u.hostname.includes('www.youtube.com')) && u.searchParams.get('v'))
      return u.searchParams.get('v');
  }catch(_){}
  return '';
}
function getThumb(idea){
  if (idea.imageUrl) return idea.imageUrl;
  const id = ytId(idea.videoUrl||'');
  if (id) return `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
  return '';
}
function esc(s){ const d=document.createElement('div'); d.textContent=String(s??''); return d.innerHTML; }

/* ---------- Swipe Functionality ---------- */
const swiper = {
  currentCard: null,
  startX: 0,
  startY: 0,
  currentX: 0,
  currentY: 0,
  isDragging: false,

  init() {
    const stack = document.getElementById('swipeStack');
    if (!stack) return;

    // Add touch/mouse event listeners
    stack.addEventListener('mousedown', (e) => this.handleStart(e));
    stack.addEventListener('touchstart', (e) => this.handleStart(e));
    document.addEventListener('mousemove', (e) => this.handleMove(e));
    document.addEventListener('touchmove', (e) => this.handleMove(e));
    document.addEventListener('mouseup', (e) => this.handleEnd(e));
    document.addEventListener('touchend', (e) => this.handleEnd(e));
  },

  handleStart(e) {
    const target = e.target.closest('.swipe-card:first-child');
    if (!target) return;

    this.currentCard = target;
    this.isDragging = true;

    const point = e.type.includes('mouse') ? e : e.touches[0];
    this.startX = point.clientX;
    this.startY = point.clientY;
    this.currentCard.classList.add('swiping');
  },

  handleMove(e) {
    if (!this.isDragging || !this.currentCard) return;

    const point = e.type.includes('mouse') ? e : e.touches[0];
    this.currentX = point.clientX - this.startX;
    this.currentY = point.clientY - this.startY;

    const rotation = this.currentX / 20;
    this.currentCard.style.transform = `translate(${this.currentX}px, ${this.currentY}px) rotate(${rotation}deg)`;

    // Show indicators
    if (this.currentX > 50) {
      this.currentCard.classList.add('dragging-right');
      this.currentCard.classList.remove('dragging-left');
    } else if (this.currentX < -50) {
      this.currentCard.classList.add('dragging-left');
      this.currentCard.classList.remove('dragging-right');
    } else {
      this.currentCard.classList.remove('dragging-right', 'dragging-left');
    }
  },

  handleEnd(e) {
    if (!this.isDragging || !this.currentCard) return;

    this.isDragging = false;
    this.currentCard.classList.remove('swiping', 'dragging-right', 'dragging-left');

    // Determine if swipe was strong enough
    if (Math.abs(this.currentX) > 100) {
      if (this.currentX > 0) {
        this.completeSwipe('right');
      } else {
        this.completeSwipe('left');
      }
    } else {
      // Snap back
      this.currentCard.style.transform = '';
      this.currentCard = null;
    }
  },

  async completeSwipe(direction) {
    if (!this.currentCard) return;

    // Animate off screen
    this.currentCard.classList.add(direction === 'right' ? 'swiped-right' : 'swiped-left');

    // Remove card after animation and show next
    setTimeout(() => {
      if (this.currentCard) {
        this.currentCard.remove();
        this.currentCard = null;
      }
      ui.renderSwipe();
    }, 300);
  },

  swipeLeft() {
    const card = document.querySelector('.swipe-card:first-child');
    if (!card) return;
    this.currentCard = card;
    this.completeSwipe('left');
  },

  swipeRight() {
    const card = document.querySelector('.swipe-card:first-child');
    if (!card) return;
    this.currentCard = card;
    this.completeSwipe('right');
  },

  skip() {
    const card = document.querySelector('.swipe-card:first-child');
    if (!card) return;

    // Open detail view
    const ideaId = card.dataset.id;
    ui.openForm(ideaId);
  }
};

/* ---------- Filters & sorting ---------- */
const filters = {
  clear(){
    state.query=''; document.getElementById('q').value='';
    ui.render();
  },
  apply(arr){
    let out = arr;

    // Filter by view
    if (state.view === 'would') {
      out = out.filter(i => i.completed === true);
    } else if (state.view === 'declined') {
      // Declined = rated 1-2 stars by current user
      out = out.filter(i => {
        const myRating = i.ratings?.[state.user] || 0;
        return myRating >= 1 && myRating <= 2 && !i.completed;
      });
    } else {
      // All = not completed and not declined (0 or 3+ rating)
      out = out.filter(i => {
        if (i.completed) return false;
        const myRating = i.ratings?.[state.user] || 0;
        return myRating === 0 || myRating >= 3;
      });
    }

    const q = state.query.trim().toLowerCase();
    if (q){
      out = out.filter(i=>{
        const hay = (i.description+' '+(i.notes||'')).toLowerCase();
        return hay.includes(q);
      });
    }

    const sort = state.sort;
    out = out.slice().sort((a,b)=>{
      switch(sort){
        case 'date_asc': return (a.createdAt||0)-(b.createdAt||0);
        case 'date_desc': return (b.createdAt||0)-(a.createdAt||0);
        case 'my_rating_desc': return (b.ratings?.[state.user]||0)-(a.ratings?.[state.user]||0);
        case 'my_rating_asc': return (a.ratings?.[state.user]||0)-(b.ratings?.[state.user]||0);
        case 'avg_desc': return avgRating(b.ratings||{})-avgRating(a.ratings||{});
        case 'avg_asc': return avgRating(a.ratings||{})-avgRating(b.ratings||{});
      }
      return 0;
    });
    return out;
  }
}

/* ---------- UI ---------- */
const ui = {
  toggleSettings(){
    const panel = document.getElementById('settingsPanel');
    panel.classList.toggle('hidden');
  },
  renderCurrent(){
    if (state.mode === 'swipe') {
      this.renderSwipe();
    } else {
      this.render();
    }
  },
  setMode(m){
    state.mode = m;
    document.getElementById('modeSwipe').classList.toggle('active', m==='swipe');
    document.getElementById('modeList').classList.toggle('active', m==='list');

    document.getElementById('swipeContainer').classList.toggle('hidden', m!=='swipe');
    document.getElementById('grid').classList.toggle('hidden', m!=='list');

    if (m === 'swipe') {
      this.renderSwipe();
    } else {
      this.render();
    }
  },
  setView(v){
    state.view = v;
    document.getElementById('viewAll').classList.toggle('active', v==='all');
    document.getElementById('viewDeclined').classList.toggle('active', v==='declined');
    document.getElementById('viewWould').classList.toggle('active', v==='would');

    if (state.mode === 'swipe') {
      this.renderSwipe();
    } else {
      this.render();
    }
  },
  openForm(id){
    const d = document.getElementById('sheet');
    const isEdit = !!id;
    const idea = isEdit ? state.ideas.find(i=>i.id===id) : null;

    document.getElementById('delBtn').classList.toggle('hidden', !isEdit);
    document.getElementById('id').value = idea?.id || '';
    document.getElementById('desc').value = idea?.description || '';
    document.getElementById('video').value = idea?.videoUrl || '';
    document.getElementById('notes').value = idea?.notes || '';
    document.getElementById('completed').checked = idea?.completed || false;

    // Handle image preview
    const imagePreview = document.getElementById('imagePreview');
    const imagePreviewImg = document.getElementById('imagePreviewImg');
    const imageFileInput = document.getElementById('imageFile');

    if (idea?.imageUrl) {
      imagePreviewImg.src = idea.imageUrl;
      imagePreview.classList.remove('hidden');
    } else {
      imagePreview.classList.add('hidden');
    }
    imageFileInput.value = '';
    state.currentImageData = null;

    stars.render('myStars', idea?.ratings?.[state.user] ?? 0, n=>stars.tmp.my=n);
    stars.tmp.my = idea?.ratings?.[state.user] ?? 0;

    d.showModal();
  },
  closeForm(){
    document.getElementById('sheet').close();
    state.currentImageData = null;
  },
  renderSwipe(){
    const stack = document.getElementById('swipeStack');
    const list = filters.apply(state.ideas);

    if (list.length === 0) {
      let message = 'No ideas yet!';
      if (state.view === 'declined') {
        message = 'No declined ideas.<br><br>Swipe left to decline ideas.';
      } else if (state.view === 'would') {
        message = 'No completed ideas.<br><br>Check off ideas you\'ve done!';
      }
      stack.innerHTML = `<div class="empty" style="position:absolute; width:100%; text-align:center; top:50%; transform:translateY(-50%)">${message}</div>`;
      return;
    }

    stack.innerHTML = list.slice(0, 3).map((idea, idx) => this.swipeCard(idea)).join('');
  },
  render(){
    state.query = document.getElementById('q').value || '';
    state.sort  = document.getElementById('sort').value;

    const grid = document.getElementById('grid');
    const list = filters.apply(state.ideas);
    document.getElementById('emptyState').classList.toggle('hidden', list.length>0);

    grid.innerHTML = list.map(idea => ui.card(idea)).join('');

    // Wire up image error fallback
    grid.querySelectorAll('img[data-id]').forEach(img=>{
      img.onerror = () => {
        const card = img.closest('.card');
        if(card){
          img.parentElement.classList.add('hidden');
        }
      }
    });
  },
  swipeCard(idea){
    const thumb = getThumb(idea);
    const otherUser = state.user==='person1'?'person2':'person1';
    const myRating = idea.ratings?.[state.user] || 0;
    const isUnrated = myRating === 0;

    // Render comments
    const comments = idea.comments || [];
    const commentsHtml = comments.map(c => `
      <div class="comment ${c.user}">
        <div class="comment-author">${users[c.user]}</div>
        <div class="comment-text">${esc(c.text)}</div>
      </div>
    `).join('');

    const media = thumb ? `
      <div class="media">
        <img src="${esc(thumb)}" alt="" />
        ${isUnrated ? `<span class="new-badge">UNRATED</span>` : ''}
      </div>` : `
      <div class="media" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, #0f2238, #1a3a52)">
        ${isUnrated ? `<span class="new-badge">UNRATED</span>` : ''}
        <div style="font-size:48px; opacity:0.3">💭</div>
      </div>`;

    // Create inline rating function
    const rateHandler = `async (n) => { await rate('${idea.id}', '${state.user}', n); }`;
    const starsHtml = stars.inline(myRating, rateHandler);

    return `
      <div class="swipe-card" data-id="${idea.id}">
        <div class="swipe-indicator like">LIKE</div>
        <div class="swipe-indicator nope">NOPE</div>
        ${media}
        <div class="card-body">
          <p class="desc">${esc(idea.description)}</p>
          <div class="rating-section">
            <label style="font-size:12px; color:var(--subtle); margin-bottom:4px; display:block;">Rate this idea</label>
            <div class="stars-inline">${starsHtml}</div>
          </div>
          <div class="comments-section">
            ${commentsHtml}
          </div>
          <div class="comment-input-wrapper">
            <input type="text" class="comment-input" id="commentInput_${idea.id}" placeholder="Add a comment..." onkeydown="if(event.key==='Enter') comments.add('${idea.id}')">
            <button class="comment-send" onclick="comments.add('${idea.id}')">Send</button>
          </div>
        </div>
      </div>
    `;
  },
  card(idea){
    const thumb = getThumb(idea);
    const my = idea.ratings?.[state.user] || 0;
    const otherUser = state.user==='person1'?'person2':'person1';
    const their = idea.ratings?.[otherUser] || 0;
    const isUnrated = my === 0;

    // Show partner's rating only if THEY rated it 3 or higher
    const showPartnerRating = their >= 3;
    const partnerRatingDisplay = showPartnerRating
      ? `${users[otherUser]}: ${'★'.repeat(their)}${'☆'.repeat(5-their)}`
      : `${users[otherUser]}: Hidden`;

    const media = thumb ? `
      <div class="media">
        <img data-id="${idea.id}" src="${esc(thumb)}" alt="" />
        ${idea.videoUrl ? `<span class="badge">Video</span>` : `<span class="badge">Image</span>`}
        ${isUnrated ? `<span class="new-badge">UNRATED</span>` : ''}
        <button class="edit" onclick="event.stopPropagation(); ui.openForm('${idea.id}')">Edit</button>
      </div>` : `
      <div class="media">
        ${isUnrated ? `<span class="new-badge">UNRATED</span>` : ''}
        <button class="edit" onclick="event.stopPropagation(); ui.openForm('${idea.id}')">Edit</button>
      </div>`;

    // Buttons for declined view
    const actionButtons = state.view === 'declined' ? `
      <div class="row-actions">
        <button class="btn primary" onclick="event.stopPropagation(); formHandlers.restore('${idea.id}')">Restore to All Ideas</button>
        <button class="btn danger" onclick="event.stopPropagation(); formHandlers.del('${idea.id}')">Delete</button>
      </div>
    ` : `
      <div class="row-actions">
        <button class="btn" onclick="event.stopPropagation(); ui.openForm('${idea.id}')">Edit</button>
        <button class="btn danger" onclick="event.stopPropagation(); formHandlers.del('${idea.id}')">Delete</button>
        <div class="grow"></div>
        ${idea.videoUrl ? `<a class="btn" href="${esc(idea.videoUrl)}" target="_blank" onclick="event.stopPropagation();">Video</a>` : ''}
      </div>
    `;

    return `
      <article class="card" onclick="ui.openDetail('${idea.id}')">
        ${media}
        <div class="card-body">
          <p class="desc">${esc(idea.description)}</p>
        </div>
        <div class="ratings">
          <div class="stars" onclick="event.stopPropagation();">
            ${stars.inline(my, n=>rate(idea.id, state.user, n))}
          </div>
          <div class="peer">${partnerRatingDisplay}</div>
        </div>
        ${actionButtons}
      </article>
    `;
  },
  openDetail(id){
    this.openForm(id);
  }
};

/* ---------- Stars ---------- */
const stars = {
  tmp:{my:0,their:0},
  render(hostId, value, onSet){
    const host = document.getElementById(hostId);
    host.innerHTML = '';
    for(let i=1;i<=5;i++){
      const el = document.createElement('span');
      el.className = 's'+(i<=value?' f':'');
      el.textContent = '★';
      el.title = String(i);
      el.style.userSelect='none';
      el.onclick = ()=>{ onSet(i); host.querySelectorAll('.s').forEach((n,ix)=>n.classList.toggle('f', ix < i)); };
      host.appendChild(el);
    }
  },
  inline(value, onSet){
    let html = '';
    for(let i=1;i<=5;i++){
      html += `<span class="s ${i<=value?'f':''}" onclick="(${onSet})( ${i} )">★</span>`;
    }
    return html;
  }
};

/* ---------- Comments ---------- */
const comments = {
  async add(ideaId) {
    const input = document.getElementById(`commentInput_${ideaId}`);
    const text = input?.value.trim();
    if (!text) return;

    const idea = state.ideas.find(i => i.id === ideaId);
    if (!idea) return;

    const newComment = {
      user: state.user,
      text: text,
      timestamp: Date.now()
    };

    const updatedComments = [...(idea.comments || []), newComment];
    await api.updateIdea(ideaId, { comments: updatedComments });
    await loadIdeas();
    ui.renderSwipe();
  }
};

/* ---------- Form handlers ---------- */
const formHandlers = {
  async save(e){
    e.preventDefault();
    const id    = document.getElementById('id').value.trim();
    const desc  = document.getElementById('desc').value.trim();
    const video = document.getElementById('video').value.trim();
    const notes = document.getElementById('notes').value.trim();
    const completed = document.getElementById('completed').checked;

    // Use uploaded image if available, otherwise keep existing
    let imageUrl = '';
    if (state.currentImageData) {
      imageUrl = state.currentImageData; // Base64 image
    } else if (id) {
      const existingIdea = state.ideas.find(i => i.id === id);
      imageUrl = existingIdea?.imageUrl || '';
    }

    if (!desc){ alert('Please enter a description.'); return; }

    const myR = stars.tmp.my|0;

    if (id){
      // edit - only update the content and current user's rating
      const idea = state.ideas.find(i => i.id === id);
      const oldRating = idea.ratings[state.user];
      await api.updateIdea(id, {
        description: desc,
        videoUrl: video,
        imageUrl: imageUrl,
        notes,
        completed,
        ratings: { ...idea.ratings, [state.user]: myR }
      });

      // Check for mutual 5 stars
      if (myR === 5 && oldRating !== 5) {
        const updatedIdea = { ...idea, ratings: { ...idea.ratings, [state.user]: myR } };
        notifications.checkMutual5Stars(updatedIdea);
      }
    } else {
      // add - only set the creator's rating
      await api.addIdea({
        description: desc,
        videoUrl: video,
        imageUrl: imageUrl,
        notes,
        completed: false,
        ratings: { person1: state.user==='person1'?myR:0, person2: state.user==='person2'?myR:0 },
        createdBy: state.user,
        comments: []
      });
    }

    await loadIdeas();
    ui.closeForm();

    if (state.mode === 'swipe') {
      ui.renderSwipe();
    } else {
      ui.render();
    }
  },
  async del(idOpt){
    const id = idOpt || document.getElementById('id').value;
    if (!id) return;
    if (!confirm('Delete this idea?')) return;
    
    await api.deleteIdea(id);
    await loadIdeas();

    try{ document.getElementById('sheet').close(); }catch(_){}

    if (state.mode === 'swipe') {
      ui.renderSwipe();
    } else {
      ui.render();
    }
  },
  async restore(ideaId) {
    // Restore a declined idea by setting rating to 0
    const idea = state.ideas.find(i => i.id === ideaId);
    if (!idea) return;

    await api.updateIdea(ideaId, {
      ratings: { ...idea.ratings, [state.user]: 0 }
    });

    await loadIdeas();

    if (state.mode === 'swipe') {
      ui.renderSwipe();
    } else {
      ui.render();
    }
  }
};

/* ---------- Rating from cards ---------- */
async function rate(id, who, n){
  const idea = state.ideas.find(i => i.id === id);
  const oldRating = idea?.ratings[who];

  await api.rateIdea(id, who, n);
  await loadIdeas();

  // Check for mutual 5 stars
  if (n === 5 && oldRating !== 5) {
    const updatedIdea = state.ideas.find(i => i.id === id);
    notifications.checkMutual5Stars(updatedIdea);
  }

  // Render based on current mode
  if (state.mode === 'swipe') {
    ui.renderSwipe();
  } else {
    ui.render();
  }
}

/* ---------- Import / Export ---------- */
const io = {
  async exportJson(){
    const data = JSON.stringify(state.ideas, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), {href:url, download:'what-if-we-export.json'});
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  },
  async importJson(){
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='.json,application/json';
    inp.onchange = async () => {
      const file = inp.files?.[0]; if(!file) return;
      const fr = new FileReader();
      fr.onload = async () => {
        try{
          const arr = JSON.parse(String(fr.result||'[]'));
          if(!Array.isArray(arr)) throw new Error('Invalid format');
          
          // normalize
          const normalized = arr.map(x => ({
            id: String(x.id || Date.now()+Math.random()),
            description: String(x.description||'').slice(0, 2000),
            videoUrl: String(x.videoUrl||''),
            imageUrl: String(x.imageUrl||''),
            createdAt: x.createdAt || Date.now(),
            tags: Array.isArray(x.tags) ? x.tags.map(String).slice(0,20) : toTags(x.tags),
            ratings: { person1: x.ratings?.person1|0, person2: x.ratings?.person2|0 },
            notes: Array.isArray(x.notes) ? x.notes : []
          }));
          
          await api.bulkUpdate(normalized);
          await loadIdeas();
          ui.render();
        }catch(err){
          alert('Import failed: '+ err.message);
        }
      };
      fr.readAsText(file);
    };
    inp.click();
  }
};

async function loadIdeas(){
  const oldIdeas = state.ideas;
  state.ideas = await api.getIdeas();

  // Check for new ideas (only after initial load)
  if (oldIdeas.length > 0) {
    notifications.checkNewIdeas(state.ideas);
  }
}

});
